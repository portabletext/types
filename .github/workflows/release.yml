name: Release

# Vendored from portabletext/.github/.github/workflows/changesets.yml, which
# runs changesets/action v1 and only works with the v2 Changesets CLI. This
# repo is on @changesets/cli v3, which needs changesets/action v2.

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read # for checkout

jobs:
  release:
    name: Create Release Pull Request or Publish to npm with Changesets
    if: github.repository_owner == 'portabletext'
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.ECOSCRIPT_CLIENT_ID }}
          private-key: ${{ secrets.ECOSCRIPT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Make sure the value of GITHUB_TOKEN will not be persisted in repo's config
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          check-latest: true
          node-version: lts/*
        # temporary until setup-node action comes with npm version that contains oidc setup by default
      - name: Update npm to use trusted publishing (OIDC)
        # Pinned to npm 11: npm 12 fails to publish with provenance
        # (`Cannot find module 'sigstore'` in `libnpmpublish/provenance.js`)
        run: npm install -g npm@11
      - run: pnpm install
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          # Release commits and tags are pushed through the GitHub API with
          # this token, so the "Version Packages" PR is opened by the app and
          # still triggers CI.
          github-token: ${{ steps.app-token.outputs.token }}
        env:
          NPM_CONFIG_PROVENANCE: true
